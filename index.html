<style>
  html{
  background:#020617;
  overscroll-behavior: none;
}

:root{
  --primary:#e11d48;
  --card:rgba(2,6,23,.75);
  --text:#f1f5f9;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  color:var(--text);
  min-height:100vh;
  background:
    linear-gradient(rgba(2,6,23,.25), rgba(2,6,23,.9)),
    url("bg.jpg") center/cover no-repeat fixed;
}
body{
  -webkit-overflow-scrolling: touch;
}

/* 🔴 KHUSUS iPHONE */
@supports (-webkit-touch-callout: none) {
  body{
    background:
      linear-gradient(rgba(2,6,23,.25), rgba(2,6,23,.9)),
      url("bg.jpg") center/cover no-repeat;
    background-attachment: scroll; /* WAJIB */
  }
}

header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px 30px;
  background:rgba(2,6,23,.85);
}
header img{width:42px}

.hero{
  text-align:center;
  padding:70px 20px;
  position:relative;
}
.search-box input{
  width:100%;
  max-width:420px;
  padding:14px 18px;
  border-radius:14px;
  border:none;
}

/* ===== RUNNING TEXT FINAL (ANTI LOMPAT & ANTI KETIMPAK) ===== */
.running-text{
  margin:18px auto 0;
  max-width:520px;
  overflow:hidden;
  background:rgba(225,29,72,.15);
  border:1px solid rgba(225,29,72,.4);
  border-radius:12px;
  padding:10px 0;
}

.marquee{
  display:flex;
  width:max-content;
  overflow:hidden;
}

.marquee__group{
  display:flex;
  white-space:nowrap;
  animation: scroll 70s linear infinite;
}

.marquee__group span{
  padding-right:60px;
  color:#facc15;
  font-weight:600;
  font-size:22px;
}

@keyframes scroll{
  from{
    transform: translateX(0);
  }
  to{
    transform: translateX(-100%);
  }
}



/* 🔴🔴🔴 PROMO STYLE START (SMALL + RICH) 🔴🔴🔴 */
.promo-box{
  margin:20px auto;
  max-width:1100px;
  padding:16px;
  background:linear-gradient(135deg,#020617,#1e293b);
  border-radius:18px;
  border:2px solid #facc15;
  position:relative;
  overflow:hidden;
}

/* efek kilap jalan */
.promo-box::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    120deg,
    transparent 0%,
    rgba(250,204,21,.25) 50%,
    transparent 100%
  );
  animation:shine 4s infinite;
}

@keyframes shine{
  from{transform:translateX(-100%)}
  to{transform:translateX(100%)}
}

.promo-title{
  text-align:center;
  font-size:20px;
  font-weight:800;
  margin-bottom:14px;
  color:#facc15;
  letter-spacing:1px;
}

/* 🔴 FIX KOLOM PROMO JADI LEBIH KECIL */
/* 🔴🔴🔴 PROMO SCROLL KE SAMPING (KANAN ↔ KIRI) 🔴🔴🔴 */
.promo-grid{
  display:flex;              /* ⬅ bukan grid */
  gap:14px;
  overflow-x:auto;           /* ⬅ scroll kanan kiri */
  padding-bottom:10px;
  scroll-snap-type:x mandatory;
}

/* sembunyikan scrollbar tapi tetap bisa scroll */
.promo-grid::-webkit-scrollbar{
  height:6px;
}
.promo-grid::-webkit-scrollbar-thumb{
  background:#facc15;
  border-radius:10px;
}

/* 🔴 SETIAP CARD PROMO */
.promo-grid .card{
  min-width:180px;           /* ⬅ ukuran card */
  flex-shrink:0;             /* ⬅ jangan mengecil */
  scroll-snap-align:start;
}


.promo-grid .card{
  padding:14px;
  position:relative;
  border:1px solid rgba(250,204,21,.4);
}
/* 🔴 PERKECIL CARD PROMO */
.promo-grid .card{
  padding:12px;
  border-radius:14px;
}


/* badge promo */
.promo-grid .card::after{
  content:"PROMO";
  position:absolute;
  top:10px;
  right:10px;
  background:#dc2626;
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:4px 8px;
  border-radius:999px;
  animation:blink 1.6s infinite;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.5}
}

/* 🔴 KHUSUS GAMBAR PROMO */
.promo-grid img{
  height:110px;
  object-fit:contain;
}
.container{
  padding:30px;
}
/* 🔴 TEKS PROMO LEBIH KECIL */
.promo-grid h3{
  font-size:14px;
  margin:6px 0;
}

.price-promo{
  font-size:16px;
}

.price-normal{
  font-size:12px;
}

.price-normal{
  text-decoration:line-through;
  color:#94a3b8;
  font-size:13px;
}

.price-promo{
  font-size:18px;
  font-weight:800;
  color:#22c55e;
}
/* 🔴🔴🔴 PROMO STYLE END 🔴🔴🔴 */


.container{padding:30px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;

  /* 🔴 TAMBAHAN ANTI LAG */
  will-change: contents;
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  cursor:pointer;
  transition:.3s;
  position:relative; /* ✅ sudah benar */
}

/* ===== BADGE GARANSI TAM (LEBIH GEDE & TURUN) ===== */
.badge-tam{
  position:absolute;
  top:44px;              /* ⬅ TURUN, AMAN DARI PROMO */
  right:12px;
  width:54px;            /* ⬅ LEBIH GEDE */
  height:54px;
  background:url("tam.png") center/contain no-repeat;
  z-index:6;
  pointer-events:none;
}

.badge-tam{
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.6));
}

.badge-bonus{
  position:absolute;
  top:10px;
  left:10px;
  background:#22c55e;
  color:#fff;
  font-size:11px;
  padding:4px 8px;
  border-radius:999px;
  font-weight:700;
}


/* TENGAHKAN TEKS KATEGORI, BRAND, PRODUK */
.card h3,
.card h2,
.card p,
.price,
#judul {
  text-align: center;
}

/* DETAIL PRODUK */
.card ul {
  text-align: left;        /* biar spesifikasi tetap rapi */
  margin: 12px auto;
  padding-left: 20px;
}

.card img {
  display: block;
  margin: 0 auto;
}

.card:hover{transform:translateY(-5px)}
.card img{width:100%;height:140px;object-fit:contain}
.img-produk{cursor:zoom-in}
.price{color:var(--primary);font-weight:bold}
.back{grid-column:1/-1;cursor:pointer;color:#93c5fd;font-weight:600}

.btn-cart{
  margin-top:12px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#facc15;
  font-weight:bold;
}
.btn-wa{
  margin-top:12px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#25D366;
  font-weight:bold;
}

/* CART */
.cart-float{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:#000;
  padding:14px 18px;
  border-radius:50px;
  font-weight:bold;
  cursor:pointer;
  z-index:999;
}
.cart-box{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  z-index:9999;
}
.cart-content{
  background:#020617;
  max-width:420px;
  margin:60px auto;
  padding:20px;
  border-radius:18px;
}
.cart-item{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}
.cart-total{margin-top:14px;font-weight:bold}

/* ZOOM */
.zoom{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.zoom img{max-width:95%;max-height:95%}

/* ===== DETAIL SPESIFIKASI RAPI ===== */
.spek-list{
  list-style:none;
  padding:0;
  margin:18px 0;

  background:rgba(255,255,255,.03);
  padding:12px;
  border-radius:12px;
}

.spek-list li{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
  font-size:14px;
}

.spek-label{
  color:#94a3b8;
  font-weight:600;
  min-width:90px;
}

.spek-value{
  text-align:right;
  font-weight:500;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px 10px;
  font-size:14px;
  color:#cbd5f5;
  background:rgba(2,6,23,.85);
}

/* 🔴 IKLAN FULL BANNER (IKUT RASIO GAMBAR) */
.ads-slider{
  position:relative;
  margin:20px auto;
  width:100%;
  max-width:1100px; /* ⬅ biar gede kayak contoh */
  aspect-ratio: 2161 / 800; /* ⬅ mirip gambar kamu */
  overflow:hidden;
  border-radius:18px;
  background:#000;
}


.ads-item img,
.ads-item video{
  width:100%;
  height:100%;
  object-fit:cover; /* 🔥 WAJIB */
  display:block;

  transform:translateZ(0);
}

/* 🔴 TOMBOL IKLAN MODERN */
.ads-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  border-radius:50%;
  border:none;
  background:rgba(0,0,0,.10);
  color:#fff;
  font-size:28px;
  cursor:pointer;
  z-index:10;
  transition:.3s;

  outline:none; /* 🔥 HILANGIN KOTAK */
  -webkit-tap-highlight-color: transparent; /* 🔥 ANDROID */
}

.ads-btn:focus{
  outline:none;
}

.ads-btn:active{
  outline:none;
  background:rgba(0,0,0,.25); /* opsional efek tekan */
}

.ads-btn:hover{
  background:rgba(0,0,0,.7);
}

.ads-btn.prev{ left:12px; }
.ads-btn.next{ right:12px; }

.ads-track{
  display:flex;
  height:100%;
  width:100%;
  transform: translate3d(0,0,0);
}

.ads-track{
  will-change: transform;
}

.ads-item{
  min-width:100%;        /* 🔥 tiap slide full layar */
  width:100%;
  height:100%;
  flex-shrink:0;         /* 🔥 biar gak ngecil */
  position:relative;

  background:#020617; /* 🔥 anti hitam kosong */
}

.ads-dots{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  z-index:10;

  opacity:0;                 /* 🔥 default sembunyi */
  pointer-events:none;
  transition:opacity .3s;
}

/* 🔥 saat aktif */
.ads-dots.show{
  opacity:1;
  pointer-events:auto;
}

.ads-dots span{
  width:8px;
  height:8px;
  background:#fff;
  opacity:.5;
  border-radius:50%;
  cursor:pointer;
}

.ads-dots span.active{
  opacity:1;
  background:#facc15;
}

/* 🔴 TESTIMONI SMOOTH */
#testimoniImg{
  max-width:100%;
  max-height:100%;
  object-fit:contain;

  opacity:1;
  transform:translateX(0) scale(1);

  transition:
    transform .22s ease,
    opacity .22s ease;

  will-change:transform, opacity;

  user-select:none;
  -webkit-user-drag:none;

  touch-action:manipulation;
}

/* 🔴 efek saat geser */
#testimoniImg.geser-kiri{
  opacity:.15;
  transform:translateX(-40px) scale(.98);
}

#testimoniImg.geser-kanan{
  opacity:.15;
  transform:translateX(40px) scale(.98);
}

#testimoniImg.aktif{
  opacity:1;
  transform:translateX(0) scale(1);
}

/* 🔴 TESTIMONI DESKTOP */
@media(min-width:1024px){

  #testimoniBox button{

    transform:translateY(-50%) scale(1.15);

  }

}

/* 🔴 HILANGKAN KOTAK FOCUS TESTIMONI */
#testimoniBox button{
  outline:none;
  -webkit-tap-highlight-color: transparent;
}

#testimoniBox button:focus{
  outline:none;
  box-shadow:none;
}

#testimoniBox button:active{
  outline:none;
  box-shadow:none;
}

#testimoniBox button::-moz-focus-inner{
  border:0;
}

@keyframes blinkPromo{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }
  50%{
    opacity:.75;
    transform:scale(1.05);
  }
}

</style>
</head>
